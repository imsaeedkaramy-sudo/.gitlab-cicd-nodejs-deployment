# ==========================================
# CI/CD Pipeline for Node.js Web Application
# ==========================================

stages:
  - test
  - build
  - deploy

variables:
  IMAGE_NAME: "saeedkarami/my-node-app" 

# ----------------- STAGE 1: TEST -----------------
run_unit_tests:
  stage: test
  image: node:18-alpine
  script:
    - echo "Installing dependencies..."
    - npm install
    - echo "Running tests..."
    - npm test
    - echo "✅ Tests passed successfully!"

# ----------------- STAGE 2: BUILD & PUSH -----------------
build_and_push_image:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - echo "Logging into Docker Hub..."
    - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
    - echo "Building Docker Image..."
    - docker build -t $IMAGE_NAME:latest .
    - echo "Pushing Image to Docker Hub..."
    - docker push $IMAGE_NAME:latest
    - echo "✅ Image successfully pushed to Docker Hub!"

# ----------------- STAGE 3: DEPLOY (Dry-Run) -----------------
deploy_to_production:
  stage: deploy
  image: alpine:latest
  only:
    - main
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts
  script:
    - echo "🚀 Deploying to Production Server: $SERVER_IP"
    - echo "ssh $SERVER_USER@$SERVER_IP 'docker pull $IMAGE_NAME:latest'"
    - echo "ssh $SERVER_USER@$SERVER_IP 'docker rm -f my-app || true'"
    - echo "ssh $SERVER_USER@$SERVER_IP 'docker run -d -p 80:3000 --name my-app $IMAGE_NAME:latest'"
    - echo "✅ Deployment Dry-Run Successful!"
